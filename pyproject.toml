[project]
name = "automated-intelligence-tests"
version = "0.1.1"
description = "Automated CAT, DAT, AUT and WRT intelligence tests for humans and AI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "dtzx00"}]
dependencies = ["glove-word-embeddings", "numpy"]

[project.urls]
Homepage = "https://github.com/dtzx00/Automated-Intelligence-Tests"
Repository = "https://github.com/dtzx00/Automated-Intelligence-Tests"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["automated_intelligence_tests"]
packages = ["tests", "tests.cat", "tests.dat", "tests.aut", "tests.wrt"]

[tool.setuptools.package-data]
"tests.cat" = ["data/*.txt", "metadata.json"]
"tests.dat" = ["metadata.json"]
"tests.aut" = ["metadata.json"]
"tests.wrt" = ["metadata.json"]
