[project]
name = "automated-intelligence-tests"
version = "0.1.3"
description = "Automated CAT, DAT, AUT and CWT intelligence tests for humans and AI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "dtzx00"}]
keywords = ["psychometrics", "creativity", "convergent-thinking", "divergent-thinking",
            "word-embeddings", "llm-evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "glove-word-embeddings>=0.1.10",
    "numpy>=1.21",
]

[project.urls]
Homepage = "https://github.com/dtzx00/Automated-Intelligence-Tests"
Repository = "https://github.com/dtzx00/Automated-Intelligence-Tests"
Issues = "https://github.com/dtzx00/Automated-Intelligence-Tests/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "automated_intelligence_tests",
    "automated_intelligence_tests.cat",
    "automated_intelligence_tests.dat",
    "automated_intelligence_tests.aut",
    "automated_intelligence_tests.cwt",
]

[tool.setuptools.package-data]
"automated_intelligence_tests.cat" = ["metadata.json", "readme.md", "data/*.txt"]
"automated_intelligence_tests.dat" = ["metadata.json", "readme.md"]
"automated_intelligence_tests.aut" = ["metadata.json", "readme.md"]
"automated_intelligence_tests.cwt" = ["metadata.json", "readme.md"]